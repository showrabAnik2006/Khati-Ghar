      rel="stylesheet"

    <style>
      /* Day Mode: Warm Cream Color Palette */
      :root {
        --bg: #fdf6e7;
        --card: #fffcf5;
        --bd: #eadbc1;
        --pri: #1b4332;
        --acc: #d97706;
        --tx: #1c1917;
        --mu: #57534e;
        --combo-bg: linear-gradient(125deg, #0b2a1e, #1b4332);
        --combo-bd: rgba(255, 255, 255, 0.18);
      }

      /* Night Mode: Dark Blue with Violet Mix */
      .dark {
        --bg: #0b0a1a;
        --card: #151332;
        --bd: #2e2963;
        --pri: #a78bfa;
        --acc: #fbbf24;
        --tx: #f3f4f6;
        --mu: #c4b5fd;
        --combo-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #3b0764 100%);
        --combo-bd: rgba(167, 139, 250, 0.35);
      }

      body {
        background: var(--bg);
        color: var(--tx);
        font-family: "Plus Jakarta Sans", "Hind Siliguri", sans-serif;
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
      }
      html[lang="bn"] body {
        font-family: "Hind Siliguri", "Plus Jakarta Sans", sans-serif;
      }
      .serif {
        font-family: "Playfair Display", serif;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        transition:
          background-color 0.35s ease,
          border-color 0.35s ease,
          transform 0.2s;
      }
      .combo-banner {
        background: var(--combo-bg);
        border: 1px solid var(--combo-bd);
        transition: background 0.35s ease, border-color 0.35s ease;
      }
      .mu {
        color: var(--mu);
      }
      .pri {
        color: var(--pri);
      }
      .acc {
        color: var(--acc);
      }
      .btn {
        background: var(--acc);
        color: #fff;
        font-weight: 600;
        border-radius: 999px;
        padding: 0.65rem 1.4rem;
        transition:
          filter 0.2s,
          transform 0.1s;
        cursor: pointer;
      }
      .dark .btn {
        color: #111827;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn2 {
        border: 1.5px solid var(--pri);
        color: var(--pri);
        font-weight: 600;
        border-radius: 999px;
        padding: 0.65rem 1.4rem;
        cursor: pointer;
      }
      .btn2:hover {
        background: var(--pri);
        color: var(--bg);
      }
      .pill {
        border: 1px solid var(--bd);
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        font-size: 0.85rem;
        min-height: 36px;
        cursor: pointer;
        transition:
          background-color 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      .pill:hover:not(.on) {
        border-color: var(--pri);
      }
      .pill.on {
        background: var(--pri);
        color: var(--bg);
        border-color: var(--pri);
        font-weight: 600;
      }
      .nav-link {
        position: relative;
        padding: 0.25rem 0.15rem;
        transition: color 0.2s;
      }
      .nav-link:hover {
        color: var(--acc);
      }
      .nav-link.active {
        color: var(--acc);
        font-weight: 700;
      }
      .nav-link.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -4px;
        height: 2.5px;
        border-radius: 99px;
        background: var(--acc);
      }
      #mnav a.active {
        color: var(--acc);
        font-weight: 700;
      }
      .inp {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 0.6rem;
        padding: 0.6rem 0.8rem;
        color: var(--tx);
      }
      .inp:focus,
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .img svg {
        width: 62%;
        height: 86%;
      }
      .ico svg {
        width: 72px;
        height: 54px;
        margin: 0 auto;
      }
      .img {
        background: linear-gradient(135deg, #f3e8d2, #faebd0);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        overflow: hidden;
      }
      .dark .img,
      .dark .hero {
        background: linear-gradient(135deg, #17153b, #2e1065);
      }
      .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .glass {
        backdrop-filter: blur(12px);
        background: color-mix(in srgb, var(--bg) 85%, transparent);
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(0, 0, 0, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0.75rem;
      }
      .modal.open {
        display: flex;
      }
      #drawer {
        transition: transform 0.3s;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .brand svg {
        width: 2.25rem;
        height: 2.25rem;
        flex-shrink: 0;
      }
      .brand .bn {
        display: block;
        font-weight: 700;
        font-size: 1.125rem;
        line-height: 1.1;
        color: var(--pri);
      }
      .brand .en {
        display: block;
        margin-top: 3px;
        font-family: "Playfair Display", serif;
        font-size: 10px;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--mu);
      }
      @media (max-width: 400px) {
        .brand svg {
          width: 1.9rem;
          height: 1.9rem;
        }
        .brand .bn {
          font-size: 1rem;
        }
        .brand .en {
          font-size: 8.5px;
          letter-spacing: 0.18em;
        }
      }
      .hp {
        padding: 0.35rem 0.6rem;
      }
      .hero {
        background: linear-gradient(135deg, #f3e8d2, #faebd0);
        overflow: hidden;
      }
      #mdrawer {
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 0.3s ease,
          visibility 0s 0.3s;
      }
      #mdrawer.open {
        transform: none;
        visibility: visible;
        transition: transform 0.3s ease;
      }
      #mov {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #mov.open {
        opacity: 1;
        pointer-events: auto;
      }
      #mdrawer.open #mnav a {
        animation: sl 0.35s both;
      }
      @keyframes sl {
        from {
          opacity: 0;
          transform: translateX(18px);
        }
      }
      #langBtn span.on {
        background: var(--pri);
        color: var(--bg);
      }
      #langBtn span:nth-child(2),
      #langBtn span:nth-child(4) {
        border-left: 1px solid var(--bd);
      }
      .fade {
        animation: fd 0.28s ease-out;
      }
      @keyframes fd {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .cert-paper {
        background: linear-gradient(180deg, #fffdf7 0%, #f8f2e2 100%);
        color: #1c1917;
        border: 2px solid #b45309;
      }
      .combo-select {
        width: 100%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 0.75rem;
        padding: 0.55rem 0.75rem;
        color: #fff;
        font-size: 0.85rem;
      }
      .combo-select option {
        background: #1e1b4b;
        color: #fff;
      }
    </style>
  </head>

        if (target) {

          target.classList.add("fade");

        $$("[data-page]").forEach((a) => {

          })
          .join("");

        const sub = cart.reduce((a, b) => a + b.price * b.qty, 0),
          dis = coupon ? Math.round(sub * 0.1) : 0,
          after = sub - dis,
          hasCombo = cart.some((c) => c.isCombo),
          del = hasCombo || after >= FD_LIMIT ? 0 : +$("#zone").value,
          tot = after + del;
        const pct = hasCombo ? 100 : Math.min(100, (after / FD_LIMIT) * 100);
        $("#fdBar").style.width = pct + "%";
        $("#fdTxt").textContent =
          hasCombo || after >= FD_LIMIT ? t.fdOk : t.fdMore(money(FD_LIMIT - after));
        $("#sum").innerHTML =
          `<div class="flex justify-between"><span class="mu">${t.sub}</span><b>${money(sub)}</b></div>` +
          (dis
            ? `<div class="flex justify-between acc"><span>${t.dis}</span><b>-${money(dis)}</b></div>`
            : "") +
          `<div class="flex justify-between"><span class="mu">${t.del}</span><b>${del ? money(del) : t.free}</b></div><div class="flex justify-between text-base font-bold border-t pt-2" style="border-color:var(--bd)"><span>${t.tot}</span><span class="pri">${money(tot)}</span></div>`;
        $("#eta").textContent =
          t.eta + ($("#zone").value === "50" ? t.eta1 : t.eta2);
      }

      window.qty = (i, d) => {
        cart[i].qty += d;
        if (cart[i].qty < 1) cart.splice(i, 1);
        saveCart();
      };

      const renderPays = () => {
        const t = T[lang];
        $("#pays").innerHTML = [
          ["cod", t.cod],
          ["bk", t.bk],
          ["ng", t.ng],
        ]
          .map(
            (x) =>
              `<button type="button" onclick="setPay('${x[0]}')" class="pill ${pay === x[0] ? "on" : ""}">${x[1]}</button>`,
          )
          .join("");
        $("#payBox").classList.toggle("hidden", pay === "cod");
      };
      window.setPay = (p) => {
        pay = p;
        renderPays();
      };

      function render() {
        const t = T[lang];
        document.documentElement.lang = lang;
        $$("[data-i18n]").forEach((el) => {
          const v = t[el.dataset.i18n];
          if (typeof v === "string") el.textContent = v;
        });
        $$("[data-ph]").forEach((el) => (el.placeholder = t[el.dataset.ph]));
        $$("#langBtn span").forEach((s) =>
          s.classList.toggle("on", s.dataset.l === lang),
        );

        updateThemeUI();
        updateTrustBadges();
        updateLoginNavLabel();

        if ($("#hubCards")) {
          $("#hubCards").innerHTML = t.hubCards
            .map(
              (c) => `<a href="#${c[0]}" data-page="${c[0]}" class="card rounded-2xl p-5 flex items-start gap-4 hover:-translate-y-1 transition-transform">
                <div class="text-3xl shrink-0">${c[1]}</div>
                <div>
                  <b class="text-base pri block">${c[2]}</b>
                  <p class="text-xs mu mt-1 leading-relaxed">${c[3]}</p>
                </div>
              </a>`,
            )
            .join("");
        }

        $("#pillars").innerHTML = t.pil
          .map(
            (p) =>
              `<div class="card rounded-2xl p-5"><div class="text-3xl">${p[0]}</div><b class="block mt-3 pri">${p[1]}</b><p class="text-sm mu mt-1">${p[2]}</p></div>`,
          )
          .join("");
        $("#sources").innerHTML = t.srcs
          .map(
            (s) =>
              `<div class="card rounded-2xl p-5 text-center"><div class="text-3xl">${s[0]}</div><b class="block mt-2 pri">${s[1]}</b><p class="text-xs mu mt-1">${s[2]}</p></div>`,
          )
          .join("");
        $("#tabs").innerHTML = t.tabs
          .map(
            (x, i) =>
              `<button onclick="setTab(${i})" class="pill ${i === tab ? "on" : ""}">${x[0]}</button>`,
          )
          .join("");
        $("#tabBody").innerHTML =
          `<ul class="space-y-3">${t.tabs[tab][1].map((s) => `<li class="flex gap-2.5"><span class="acc font-bold">✓</span><span>${s}</span></li>`).join("")}</ul>` +
          `<div class="mt-5 pt-4 border-t text-xs font-semibold pri flex items-center gap-2" style="border-color:var(--bd)"><span>🛡️</span><span>${t.cert}</span></div>`;
        $("#cmp").innerHTML = t.cmp
          .map(
            (r) =>
              `<tr class="border-t" style="border-color:var(--bd)"><td class="p-4 font-semibold">${r[0]}</td><td class="p-4 pri">✓ ${r[1]}</td><td class="p-4 mu">✕ ${r[2]}</td></tr>`,
          )
          .join("");

        renderHomeCats();
        renderComboSection();
        renderVideoSection();
        renderCategoryBar();
        renderProducts();
        renderCertificates();
        renderReviewSection();
        renderFaqs();
        renderPays();
        renderCart();
        if (currentPage === "login") renderAuthPage();
      }
      window.setTab = (i) => {
        tab = i;
        render();
      };

      $("#prodSearch").oninput = (e) => {
        searchQuery = e.target.value;
        renderProducts();
      };

      $("#langBtn").onclick = () => {
        lang = lang === "bn" ? "en" : "bn";
        localStorage.setItem("kg_lang", lang);
        render();
      };
      $("#themeBtn").onclick = toggleTheme;
      const openCart = () => {
        $("#ov").classList.remove("hidden");
        $("#drawer").classList.remove("translate-x-full");
      };
      const closeCart = () => {
        $("#ov").classList.add("hidden");
        $("#drawer").classList.add("translate-x-full");
      };
      $("#cartBtn").onclick = $("#floatCart").onclick = openCart;
      $("#closeCart").onclick = $("#ov").onclick = closeCart;
      const openMenu = () => {
        $("#mdrawer").classList.add("open");
        $("#mov").classList.add("open");
      };
      const closeMenu = () => {
        $("#mdrawer").classList.remove("open");
        $("#mov").classList.remove("open");
      };
      $("#menuBtn").onclick = openMenu;
      $("#mClose").onclick = $("#mov").onclick = closeMenu;
      $("#zone").onchange = renderCart;
      $("#gift").onchange = (e) =>
        $("#giftBox").classList.toggle("hidden", !e.target.checked);

      $("#applyCp").onclick = () => {
        const ok = $("#coupon").value.trim().toUpperCase() === "KHATI10";
        coupon = ok;
        $("#cpMsg").textContent = ok ? T[lang].cpOk : T[lang].cpBad;
        $("#cpMsg").style.color = ok ? "var(--pri)" : "#dc2626";
        renderCart();
      };

      const validPhone = (v) =>
        /^(\+?88)?01[0-9]{9}$/.test(
          v.replace(/[\s-]/g, "").replace(/[০-৯]/g, (d) => "০১২৩৪৫৬৭৮৯".indexOf(d)),
        );

      $("#cbBtn").onclick = () => {
        const ok = validPhone($("#cbPh").value);
        $("#cbMsg").textContent = ok ? T[lang].cbOk : T[lang].cbBad;
        $("#cbMsg").style.color = ok ? "var(--pri)" : "#dc2626";
        if (ok) $("#cbPh").value = "";
      };

      window.openTrack = (prefill = "", isJustConfirmed = false) => {
        const t = T[lang];
        $("#tmBody").innerHTML = `<div class="flex justify-between items-center">
            <h3 class="text-xl font-bold pri">${t.trT}</h3>
            <button onclick="closeTrack()" class="pill">✕</button>
          </div>
          ${
            isJustConfirmed
              ? `<div class="mt-3 p-3 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600/15 text-emerald-800 dark:text-emerald-200 border border-emerald-600/30">
                  ${t.trConfirmedBanner}
                </div>`
              : ""
          }
          <div class="flex gap-2 mt-4">
            <input id="trIn" class="inp uppercase" placeholder="KG-1042" value="${prefill}">
            <button onclick="doTrack()" class="btn">${t.trBtn}</button>
          </div>
          <p class="text-xs mu mt-2">${t.trDemo} <b>KG-1042</b>, <b>KG-1089</b></p>
          <p class="text-xs acc font-semibold mt-1">📞 ${t.trHelp}</p>
          <div id="trOut" class="mt-4"></div>`;
        $("#tm").classList.add("open");
        if (prefill) doTrack();
      };
      window.closeTrack = () => $("#tm").classList.remove("open");

      window.doTrack = () => {
        const t = T[lang],
          id = $("#trIn").value.trim().toUpperCase();
        const o = getAllOrders()[id];
        if (!o) {
          $("#trOut").innerHTML = `<p class="text-sm" style="color:#dc2626">${t.trBad}</p>`;
          return;
        }
        const currentStep = Number(o.step) || 0;
        $("#trOut").innerHTML = `<div class="card rounded-xl p-4 space-y-3 text-sm">
          <div class="flex justify-between items-center">
            <div><span class="mu text-xs block">${t.trDate}</span><b>${o.date}</b></div>
            <div class="text-right"><span class="mu text-xs block">${t.trAreaL}</span><b>${t.trArea[o.area]}</b></div>
          </div>
          ${o.items ? `<p class="text-xs mu border-t pt-2" style="border-color:var(--bd)">${o.items}</p>` : ""}
          <ol class="space-y-2.5 pt-2 border-t" style="border-color:var(--bd)">
            ${t.trSteps
              .map(
                (s, i) =>
                  `<li class="flex items-center justify-between gap-2 ${i <= currentStep ? "pri font-semibold" : "mu"}">
                    <div class="flex items-center gap-2.5">
                      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs ${i <= currentStep ? "text-white" : "border"}" style="${i <= currentStep ? "background:var(--pri)" : "border-color:var(--bd)"}">${i <= currentStep ? "✓" : num(i + 1)}</span>
                      <span>${s}</span>
                    </div>
                    ${i === currentStep ? `<span class="text-[11px] px-2 py-0.5 rounded-full acc font-bold" style="background:color-mix(in srgb, var(--acc) 15%, transparent)">● Current</span>` : ""}
                  </li>`,
              )
              .join("")}
          </ol>
          <div class="pt-2 border-t flex items-center justify-between gap-2 text-[11px] mu" style="border-color:var(--bd)">
            <span>${t.trAdminNote}</span>
            <button type="button" onclick="doTrack()" class="acc font-bold hover:underline shrink-0">${t.trRefresh}</button>
          </div>
        </div>`;
      };
      $$("[data-track]").forEach((a) =>
        a.addEventListener("click", (e) => {
          e.preventDefault();
          closeMenu();
          openTrack();
        }),
      );

      $("#confirm").onclick = () => {
        const t = T[lang],
          name = $("#fName").value.trim(),
          phone = $("#fPhone").value.trim(),
          addr = $("#fAddr").value.trim();
        let err = !name
          ? t.eName
          : !validPhone(phone)
            ? t.ePhone
            : !addr
              ? t.eAddr
              : pay !== "cod" && !$("#trx").value.trim()
                ? t.eTrx
                : "";
        if (err) {
          toast(err);
          return;
        }
        const id = "KG-" + Math.floor(1000 + Math.random() * 9000);
        const today = new Date().toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
        const itemsSummary = cart
          .map((c) => {
            if (c.isCombo) return `${t.comboName} × ${c.qty}`;
            const p = PRODUCTS_DATA.find((x) => x.id === c.id);
            const sz = p ? p.sizes[c.sizeIdx] : null;
            return `${p ? p[lang].n : c.id} (${sz ? (lang === "bn" ? sz.l_bn : sz.l_en) : ""}) × ${c.qty}`;
          })
          .join(", ");

        const o = JSON.parse(localStorage.getItem("kg_orders") || "{}");
        o[id] = {
          id,
          date: today,
          area: $("#zone").value === "50" ? 0 : 1,
          step: 0,
          customer: name,
          phone,
          items: itemsSummary,
          userId: currentUser && currentUser.role === "user" ? currentUser.id : null,
        };
        localStorage.setItem("kg_orders", JSON.stringify(o));

        cart = [];
        coupon = false;
        saveCart();
        closeCart();
        toast(t.oT);
        openTrack(id, true);
      };

      const initialHash = location.hash.replace("#", "");
      render();
      saveCart();
      goPage(VALID_PAGES.includes(initialHash) ? initialHash : "home", false);
    </script>
  </body>
</html>
